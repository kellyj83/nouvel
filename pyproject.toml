[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nouvel-followup"
version = "0.1.0"
description = "A review-first post-call follow-up agent for Granola and Attio workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
]

[tool.setuptools.packages.find]
where = ["src"]

